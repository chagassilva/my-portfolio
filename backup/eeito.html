<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <style>
    .container {
      position: relative;
      width: 300px;
      height: 200px;
      margin: 50px auto;
      overflow: hidden;
      border-radius: 10px;
    }

    .imagem {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 10px;
    }

    .borda-animada {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      pointer-events: none;
    }

    .borda-animada::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
      animation: correr 3s linear infinite;
      z-index: 1;
      opacity: 0.7;
    }

    .borda-animada::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      right: 2px;
      bottom: 2px;
      background: white;
      border-radius: 8px;
      z-index: 2;
    }

    @keyframes correr {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="imagem" src="https://via.placeholder.com/300x200" alt="Imagem">
    <div class="borda-animada"></div>
  </div>
</body>
</html>
